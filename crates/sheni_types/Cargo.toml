[package]
name = "sheni_types"
version.workspace = true
edition = "2021"

[lib]
name = "sheni_types"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
syon-parser = { path = "../syon-parser" }
serde = { version = "1", features = ["derive"] }
uuid = "1.26.0"
iso8601-duration = "0.2.0"
humantime = "2.4.0"
url = "2.5.8"
iso_currency = "0.7.0"
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting", "macros"] }
email_address = { version = "0.2.9", default-features = false }
edtf-core = "1.2.3"

[dev-dependencies]
serde_json = "1"
