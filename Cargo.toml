[workspace]
resolver = "2"
members = [
    "crates/syon-parser",
    "crates/syon-python",
    "crates/syon-cli",
    "crates/sheni_types",
    "crates/shelishi_schema",
    "crates/luach_types",
    "crates/hodesh_calendar",
    "crates/shlita_types",
    "crates/one-settings",
    "crates/one-git",
]

# Inherited by every member with `version.workspace = true`, so a release is
# one line here rather than eight edits that can disagree.
[workspace.package]
version = "2026.0.0"   # `{year}.{major}.{patch}`, as the suite uses
